name: Android build
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Debug APK
        run: ./gradlew assembleDebug
      - name: Release AAB
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > paylog-release.jks
          cat > keystore.properties <<PROPS
          storeFile=paylog-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-outputs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
      - name: Publish APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "PayLog-${GITHUB_REF_NAME#v}-unsigned-debug.apk"
          gh release create "$GITHUB_REF_NAME" "PayLog-${GITHUB_REF_NAME#v}-unsigned-debug.apk" \
            --title "嗶記帳 ${GITHUB_REF_NAME}" --notes "CI 編譯（除錯簽章）。正式安裝檔請用自己的簽章金鑰重新簽署。" \
            || gh release upload "$GITHUB_REF_NAME" "PayLog-${GITHUB_REF_NAME#v}-unsigned-debug.apk" --clobber
