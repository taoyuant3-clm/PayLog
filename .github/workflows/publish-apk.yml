name: Publish APK release
# 把簽署好的 APK 放入 releases/（檔名須含版本號，如 PayLog-1.3.1.apk），推送到 main 即自動發 Release
on:
  push:
    branches: ['main']
    paths: ['releases/*.apk']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create a release for each APK that has none yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in releases/*.apk; do
            VER=$(basename "$f" .apk | grep -oP '\d+(\.\d+)+' | tail -1)
            [ -z "$VER" ] && { echo "skip $f (no version in name)"; continue; }
            TAG="v$VER"
            if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG exists, skip"; continue; fi
            gh release create "$TAG" "$f" --target "$GITHUB_SHA" --latest \
              --title "嗶記帳 PayLog $TAG" \
              --notes "嗶記帳 PayLog $VER 正式簽署版 APK。下載後在 Android 手機直接安裝，可覆蓋舊版，資料保留。"
          done
