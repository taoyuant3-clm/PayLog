# 用 XcodeGen 產生 Xcode 專案：brew install xcodegen && xcodegen
name: PayLog
options:
  bundleIdPrefix: tw.clmchiu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # 填入你的 Apple Developer Team ID（或在 Xcode 的 Signing 選單選）
    CODE_SIGN_STYLE: Automatic
targets:
  PayLog:
    type: application
    platform: iOS
    sources:
      - path: PayLog
    settings:
      base:
        PRODUCT_NAME: PayLog
        PRODUCT_BUNDLE_IDENTIFIER: tw.clmchiu.paylog   # 上架前可改成你自己的唯一 ID
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: PayLog/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
